name: Refresh welcome ticker
on:
  schedule:
    - cron: "*/5 3-13 24-27 11 *"   # every 5 min, 08:30-19:30 IST, 24-27 Nov
  workflow_dispatch:
permissions:
  contents: write
concurrency: ticker
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch personalised feed
        run: |
          F=https://nnointygnobmivjaebcr.supabase.co/functions/v1/tw-ticker?d=e1c5a4be1b
          curl -fsS --max-time 30 "$F" -o new.xml && grep -q "<rss" new.xml && mv new.xml welcome.xml
          curl -fsS --max-time 30 "$F&ascii=1" -o new2.xml && grep -q "<rss" new2.xml && mv new2.xml welcome-ascii.xml
          # commit only when the text changed (ignore timestamps / ids)
          norm(){ sed -E 's#<(pubDate|lastBuildDate|guid)[^>]*>[^<]*</(pubDate|lastBuildDate|guid)>##g' "$1"; }
          if [ "$(norm welcome.xml)" = "$(git show HEAD:welcome.xml | sed -E 's#<(pubDate|lastBuildDate|guid)[^>]*>[^<]*</(pubDate|lastBuildDate|guid)>##g')" ]; then git checkout -- welcome.xml welcome-ascii.xml; echo "no change"; exit 0; fi
          git config user.name "ticker-bot"; git config user.email "ticker-bot@users.noreply.github.com"
          git add welcome.xml welcome-ascii.xml && git commit -m "Ticker: refresh attendee names" && git push
