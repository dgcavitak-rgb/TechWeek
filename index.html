<style>
:root{
  --red:#C8232C;--red-d:#A51B23;--red-50:#FDF1F2;--ink:#14171A;--ink-2:#3A4149;--muted:#6B7480;--line:#E4E7EB;--line-2:#EEF0F3;
  --bg:#F5F6F8;--card:#FFFFFF;--green:#16794A;--green-50:#E9F7EF;--amber:#B26A00;--amber-50:#FFF5E1;--blue:#1F5FBF;--blue-50:#EAF1FD;
  --grey-50:#F1F3F5;--r:12px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--red)}
h1,h2,h3{margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.stack>*+*{margin-top:12px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.b{font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);min-height:40px}
.btn:hover{background:var(--grey-50)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.primary:hover{background:var(--red-d)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.in{width:100%;border:1px solid #D3D8DE;border-radius:10px;padding:10px 12px;background:#fff;min-height:42px}
.in:focus{outline:2px solid rgba(200,35,44,.25);border-color:var(--red)}
textarea.in{min-height:84px;resize:vertical}
.grid{display:grid;gap:12px}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--grey-50);color:var(--ink-2);white-space:nowrap}
.chip.pending{background:var(--amber-50);color:var(--amber)}.chip.approved{background:var(--green-50);color:var(--green)}
.chip.waitlisted{background:var(--blue-50);color:var(--blue)}.chip.rejected,.chip.cancelled{background:#F4F4F5;color:#71717A}
.chip.open{background:var(--green-50);color:var(--green)}.chip.draft{background:var(--grey-50);color:var(--muted)}.chip.closed{background:#F4F4F5;color:#52525B}
.chip.in{background:var(--green);color:#fff}
.bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--red);border-radius:99px}
.kpi{padding:14px 16px}.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em}.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:#9B1C22}
.modal-bg{position:fixed;inset:0;background:rgba(15,18,22,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:720px){.modal-bg{align-items:center}}
.modal{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
@media(min-width:720px){.modal{border-radius:16px}}
.modal{position:relative}
.modal h3{font-size:18px;margin-bottom:12px;padding-right:36px}
.mclose{position:sticky;top:0;float:right;margin:-6px -6px 0 0;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;color:var(--muted);z-index:2}
.mclose:hover{background:var(--grey-50);color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}
.spin.dark{border-color:#0002;border-top-color:var(--red)}
@keyframes s{to{transform:rotate(360deg)}}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* ---------- public pages ---------- */
.hero{background:linear-gradient(135deg,#C8232C 0%,#8E1219 100%);color:#fff;padding:28px 0 64px}
.hero .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:600}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:6px 0 8px}
@media(min-width:640px){.hero h1{font-size:36px}}
.lift{margin-top:-44px}
.slotday{margin-top:14px}.slotday h4{margin:0 0 8px;font-size:14px;color:var(--ink-2)}
.slots{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:520px){.slots{grid-template-columns:1fr 1fr}}
.slot{border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff;text-align:left;width:100%}
.slot:hover{border-color:#C9CED4}
.slot.sel{border-color:var(--red);background:var(--red-50);box-shadow:0 0 0 3px rgba(200,35,44,.12)}
.slot.dis{opacity:.45;cursor:not-allowed}
.slot .tt{font-weight:700}.slot .seats{font-size:12px;font-weight:600;margin-top:4px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);background:var(--grey-50);padding:12px;border-radius:10px}
.consent input{margin-top:3px;width:18px;height:18px;accent-color:var(--red);flex:none}
.hp{position:absolute;left:-5000px}
.qrbox{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:12px;border:1px dashed #CBD1D8}
.qrbox img,.qrbox canvas{width:220px!important;height:220px!important}
.foot{padding:26px 0 40px;text-align:center;color:var(--muted);font-size:12px}
/* ---------- console ---------- */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.01em}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--red);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.tabs{display:none;gap:4px;margin-left:12px}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--red-50);color:var(--red)}
@media(min-width:900px){.tabs{display:flex}.bnav{display:none!important}}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:var(--red)}
main.console{padding:16px 0 96px}
@media(min-width:900px){main.console{padding-bottom:40px}}
.ev{padding:14px 16px}
.ev h3{font-size:16px}
.reg{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.reg:last-child{border-bottom:0}
.reg input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--red);flex:none}
.reg .nm{font-weight:700}
.sticky-actions{position:sticky;bottom:72px;z-index:10;margin-top:10px}
@media(min-width:900px){.sticky-actions{bottom:12px}}
.scanres{border-radius:14px;padding:16px;color:#fff}
.scanres.ok{background:var(--green)}.scanres.warn{background:var(--amber)}.scanres.bad{background:#9B1C22}
.scanres .big{font-size:22px;font-weight:800}
#reader{width:100%;max-width:420px;margin:0 auto;border-radius:12px;overflow:hidden;background:#000}
.banner{border-radius:12px;padding:12px 14px;font-size:14px}
.banner.warn{background:var(--amber-50);color:#6B4200;border:1px solid #F3D9A4}
.banner.info{background:var(--blue-50);color:#173E7A;border:1px solid #C9DAF6}
.poster{width:100%;max-width:420px;margin:0 auto;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.poster .ph{background:linear-gradient(135deg,#C8232C,#8E1219);color:#fff;padding:20px}
.poster .pb{padding:18px;text-align:center}
.minibars .r{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.minibars .r span:first-child{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minibars .r .bar{flex:1}


/* ---------- console polish ---------- */
:root{--acc:#C8232C;--acc-50:#FDF1F2}
.top{background:rgba(255,255,255,.92);backdrop-filter:blur(10px)}
.tabs button{display:inline-flex;align-items:center;gap:7px;position:relative}.tabs button svg{width:17px;height:17px}
.tabs button:hover{background:var(--grey-50);color:var(--ink)}
.nbadge{font-style:normal;background:var(--red);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;padding:1px 6px;line-height:1.5}
.bnav button{position:relative}.bnav .nbadge{position:absolute;top:3px;left:calc(50% + 6px)}
.btn .nbadge{margin-left:2px}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer}
.acct:hover{background:var(--grey-50)}.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7C1219);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.acct-t{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}.acct-t b{font-size:13px}.acct-t small{font-size:11px;color:var(--muted)}
@media(max-width:520px){.acct-t{display:none}.acct{padding:3px}}
.btn svg{flex:none}
.phead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.phead h2{font-size:22px}
.pico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,var(--red),#7C1219);box-shadow:0 6px 16px rgba(200,35,44,.25)}
.pico svg{width:22px;height:22px}.pico.sm{width:34px;height:34px;border-radius:10px}.pico.sm svg{width:18px;height:18px}
.segi button{display:inline-flex;align-items:center;gap:6px}
.dhero{position:relative;overflow:hidden;border-radius:18px;color:#fff;padding:22px;margin-bottom:14px;display:grid;gap:16px;
  background:radial-gradient(600px 300px at 90% 0%,rgba(255,255,255,.16),transparent 60%),linear-gradient(135deg,#1A0B0D 0%,#8E1219 50%,#C8232C 100%)}
@media(min-width:760px){.dhero{grid-template-columns:1fr 320px;align-items:center}}
.dh-art{position:absolute;right:-30px;top:-10px;width:420px;opacity:.8;pointer-events:none}
.dh-in{position:relative}.dh-k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.8;font-weight:600}
.dhero h2{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0}.dh-s{opacity:.85;font-size:14px}
.dh-btn{margin-top:14px;background:#fff;color:#8E1219;border:0}.dh-btn:hover{background:#FDF1F2}
.dh-next{position:relative;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:14px;backdrop-filter:blur(8px)}
.dh-nk{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600;opacity:.85;margin-bottom:4px}
.dh-seat{margin-top:10px;font-size:13px}.dh-bar{height:6px;border-radius:9px;background:rgba(255,255,255,.25);margin-top:4px;overflow:hidden}.dh-bar i{display:block;height:100%;background:#fff;border-radius:9px}
.kgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}@media(min-width:900px){.kgrid{grid-template-columns:repeat(4,1fr)}}
.kpi2{position:relative;padding:14px 16px}.kpi2 .v{font-size:28px;font-weight:800;letter-spacing:-.02em}.kpi2 .of{font-size:15px;color:var(--muted);font-weight:600}
.kpi2 .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding-right:44px}
.kico{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.t-blue .kico,.tico.t-blue{background:var(--blue-50);color:var(--blue)}.t-amber .kico,.tico.t-amber{background:var(--amber-50);color:var(--amber)}
.t-red .kico,.tico.t-red{background:var(--red-50);color:var(--red)}.t-green .kico,.tico.t-green{background:var(--green-50);color:var(--green)}
.t-grey .kico,.tico.t-grey{background:var(--grey-50);color:var(--ink-2)}
.t-amber .v{color:var(--amber)}.t-green .v{color:var(--green)}
.dcols{display:grid;gap:14px;margin-bottom:14px}@media(min-width:900px){.dcols{grid-template-columns:1.2fr 1fr}}
.sech{display:flex;gap:8px;align-items:center;font-weight:700;margin-bottom:10px}.sech svg{color:var(--red)}
.todo{display:grid;gap:6px}.todo-i{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line-2);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;width:100%}
.todo-i:hover{background:var(--grey-50);border-color:var(--line)}.todo-i b{display:block;font-size:14px}.todo-i small{display:block;color:var(--muted);font-size:12px}.todo-i>svg{color:var(--muted);flex:none}
.tico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.allclear{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;background:var(--green-50);color:var(--green)}.allclear b{color:var(--ink)}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:520px){.qa{grid-template-columns:repeat(3,1fr)}}
.qa-i{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line-2);background:#fff;border-radius:12px;padding:12px;cursor:pointer}
.qa-i:hover{border-color:var(--red);background:var(--red-50)}.qa-i b{font-size:14px;margin-top:6px}.qa-i small{color:var(--muted);font-size:12px}
.qico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--red-50);color:var(--red)}
.tl{display:grid;gap:10px}@media(min-width:760px){.tl{grid-template-columns:1fr 1fr}}
.tl-i{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px;background:var(--grey-50)}
.rg-date{width:46px;border-radius:10px;overflow:hidden;text-align:center;border:1px solid var(--line);background:#fff;flex:none}
.rg-date span{display:block;background:var(--acc,var(--red));color:#fff;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 0}.rg-date b{display:block;font-size:19px;padding:2px 0}
.ev2{padding:16px}.ev-top{display:flex;gap:14px;align-items:flex-start}.ev-date{width:54px}.ev-date b{font-size:22px}
.ev2 h3{margin:6px 0 4px;font-size:17px}
.chip.live{background:var(--red);color:#fff;animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.7}}
.ev-ring{--p:0;flex:none;width:66px;height:66px;border-radius:50%;display:grid;place-content:center;text-align:center;line-height:1.05;
  background:radial-gradient(closest-side,#fff 76%,transparent 78% 100%),conic-gradient(var(--red) calc(var(--p)*1%),var(--line-2) 0)}
.ev-ring b{font-size:15px}.ev-ring small{font-size:10px;color:var(--muted)}
@media(max-width:520px){.ev-ring{width:54px;height:54px}.ev-ring b{font-size:13px}}
.ev-stats{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.ev-stats span{display:inline-flex;align-items:center;gap:5px;font-size:13px;background:var(--grey-50);border-radius:999px;padding:4px 10px}
.ev-stats .a{background:var(--amber-50);color:var(--amber)}.ev-stats .w{background:var(--blue-50);color:var(--blue)}.ev-stats .g{background:var(--green-50);color:var(--green)}
.ev-days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px}
.ev-day{min-width:108px;flex:1;background:var(--grey-50);border-radius:10px;padding:8px;display:grid;gap:5px}
.ev-sl{position:relative;height:20px;border-radius:6px;background:#fff;overflow:hidden;border:1px solid var(--line-2)}
.ev-sl i{position:absolute;inset:0 auto 0 0;opacity:.18}.ev-sl span{position:relative;font-size:11px;font-weight:600;padding-left:6px;line-height:18px}
.ev-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line-2)}
.card.empty svg{color:var(--muted)}
.kpi2{min-width:0}@media(max-width:600px){.kpi.kpi2 .kico{display:none}.kpi.kpi2 .l{padding-right:0}}

/* ---------- multi-brand ---------- */
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-h div{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:2px 4px}
.cal-c{min-height:86px;border:1px solid var(--line-2);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:3px;background:#fff}.cal-c.off{background:transparent;border:0}.cal-c.wk{background:#FAFAFB}
.cal-c.today{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}.cal-d{font-size:12px;font-weight:700;color:var(--muted)}
.cal-i{display:flex;gap:4px;align-items:center;flex-wrap:wrap;text-align:left;border:0;border-left:3px solid var(--bc);background:color-mix(in srgb,var(--bc) 10%,#fff);border-radius:5px;padding:3px 5px;font-size:11px;cursor:pointer;line-height:1.25}
.cal-i b{font-weight:700}.cal-i span{margin-left:auto;font-weight:700;color:var(--bc)}
@media(max-width:700px){.cal-c{min-height:60px}.cal-i{font-size:10px}.cal-i span{display:none}}
.rg-yn button.on{background:var(--acc);color:#fff;border-color:var(--acc)}

.logo span,.tabs button{white-space:nowrap}.tabs button{padding:8px 10px}

    w.innerHTML=`Welcome, ${esc(p.name)}! 👋<small>${esc(p.org)}</small>`; w.classList.add("on");
    setTimeout(()=>{ w.classList.remove("on"); setTimeout(()=>{ showing=false; showNext() },600) },4500) };
  const clock=()=>{ $("#tv_clk").textContent=new Date().toLocaleString("en-IN",{weekday:"long",day:"numeric",month:"long",hour:"numeric",minute:"2-digit"}) };

      first=false; showNext();
    }catch(e){ /* keep showing last state; retry next tick */ }
  };
  clock(); setInterval(clock,20000); tick(); setInterval(tick,8000);

const BTN_IC=[[/^(\+\s*)?(new|add)\b/i,"plus"],[/walk-?in/i,"userplus"],[/share/i,"share"],[/^approve/i,"check"],[/^reject/i,"x"],[/waitlist/i,"clock"],[/^move/i,"move"],
 [/check(ed)?[\s-]?in|undo/i,"scan"],[/scan|camera/i,"scan"],[/whatsapp/i,""],[/copy/i,"copy"],[/resend|^send|retry|invite/i,"send"],[/export|download|template|\.ics|pdf/i,"download"],
 [/upload|import/i,"upload"],[/delete|remove|purge/i,"trash"],[/^edit|details/i,"edit"],[/refresh|reload/i,"refresh"],[/^save|update/i,"save"],[/print|poster/i,"printer"],
 [/open|view|preview|screen|display/i,"eye"],[/reset|password/i,"key"],[/session/i,"layers"],[/certificate/i,"award"],[/email|mail/i,"mail"],[/qr/i,"qr"],[/link/i,"link"]];
const KPI_IC=[[/pending/i,"clock","amber"],[/wait/i,"list","blue"],[/no-?show|absent/i,"alert","red"],[/check|attend|show/i,"scan","green"],[/approv|confirm/i,"check","red"],[/rating|feedback|score/i,"star","amber"],
 [/target/i,"target","blue"],[/invite|sent/i,"mail","blue"],[/contact|regist|people|total/i,"users","blue"],[/org|compan|partner/i,"building","blue"],[/.*/,"chart","grey"]];
function decorateIcons(root){
  root.querySelectorAll(".btn:not([data-ic]), .kpi:not([data-ic])").forEach(el=>{
    el.dataset.ic=1;
    if(el.classList.contains("kpi")){ const l=el.querySelector(".l"); if(!l||el.querySelector(".kico")) return; const m=KPI_IC.find(([r])=>r.test(l.textContent));
      el.classList.add("kpi2","t-"+m[2]); el.insertAdjacentHTML("afterbegin",`<span class="kico">${ico(m[1],18)}</span>`); return }
    if(el.querySelector("svg,.spin,img")||el.closest(".rg-hero,.rg-main,.rg-done")) return;
    const txt=el.textContent.trim(); if(!txt||/^\p{Extended_Pictographic}/u.test(txt)||/^(cancel|close|no|back|ok)$/i.test(txt)) return;
    const m=BTN_IC.find(([r])=>r.test(txt)); if(!m||!m[1]) return;
    const tn=[...el.childNodes].find(n=>n.nodeType===3&&n.textContent.trim()); if(tn) tn.textContent=tn.textContent.replace(/^\s*[+⬆⬇↻✎🗑✓✕→]\s*/u,"");
    el.insertAdjacentHTML("afterbegin",ico(m[1],15));
  });
  root.querySelectorAll("#view h2:not([data-ic])").forEach(h2=>{ h2.dataset.ic=1; if(h2.closest(".phead,.dhero")) return;
    const ic=ICONS[S.tab]; if(ic&&h2.parentElement){ h2.style.display="flex"; h2.style.alignItems="center"; h2.style.gap="10px"; h2.insertAdjacentHTML("afterbegin",`<span class="pico sm">${ic}</span>`) } });
}

function cloneEvent(e){
  const vs=(S.ov.venues||[]).filter(v=>v.is_active);
  const sl=e.slots.filter(s=>s.is_active).sort((a,b)=>a.starts_at.localeCompare(b.starts_at));
  if(!sl.length) return toast("This event has no sessions to copy",true);
  modal(`<h3>Clone “${esc(e.title)}”</h3><form class="stack" id="clf">
    <div class="small muted">Copies the title, description, agenda, brands and the session pattern (${sl.length} sessions). You can adjust everything before saving. The copy starts as a draft.</div>
    <div class="grid g2"><div><label class="f">New venue / experience center</label><select class="in" id="cl_v">${vs.map(v=>`<option value="${v.id}">${esc(v.city)} — ${esc(v.name)} (${v.capacity} seats)</option>`).join("")}</select></div>
      <div><label class="f">First day of the new event</label><input class="in" type="date" id="cl_d" min="${todayStr()}" required><div class="tiny muted" id="cl_dl">Original first day: ${esc(dayLabel(sl[0].local_date))}</div></div></div>
    <div><label class="f">New title</label><input class="in" id="cl_t" value="${esc(e.title)}"></div>
    <div class="row"><button class="btn primary">Continue to edit</button><button type="button" class="btn" data-close>Cancel</button></div></form>`, m=>{
    const other=vs.find(v=>v.id!==e.venue_id); if(other) $("#cl_v").value=other.id;
    const retitle=()=>{ const v=vs.find(x=>x.id===$("#cl_v").value); if(v&&e.city&&e.title.includes(e.city)) $("#cl_t").value=e.title.split(e.city).join(v.city) };
    $("#cl_v").onchange=retitle; retitle();
    $("#cl_d").onchange=()=>$("#cl_dl").textContent=dayLabel($("#cl_d").value);

      const v=vs.find(x=>x.id===$("#cl_v").value)||{}; const off=Math.round((new Date(nd+"T00:00:00")-new Date(sl[0].local_date+"T00:00:00"))/864e5);

      const copyE={title:$("#cl_t").value,description:e.description,agenda:e.agenda,program_id:e.program_id,venue_id:v.id,status:"draft",auto_approve:e.auto_approve,brand_ids:e.brand_ids||[],company_cap:e.company_cap,
        slots:sl.map(s=>({local_date:shift(s.local_date),label:s.label,local_start:s.local_start,local_end:s.local_end,capacity:Math.min(s.capacity,v.capacity||s.capacity),approved:0,is_active:true}))};
      closeModal(true); editEvent(copyE); toast("Review the copied sessions, then save") };
  });
}

      const dayLines=Object.keys(days).sort().map(k=>{ const d0=days[k][0]; const dl=d0.date_label.split(",")[0].slice(0,3)+", "+(d0.date_label.split(",")[1]||"").trim().replace(/ \d{4}$/,"").replace(/(\d+) (\w{3})\w*/,"$1 $2");
        return "▫️ "+dl+"  —  "+days[k].map(s=>s.label+" "+short(s.time_label)).join("  |  ") }).join("\n");
      const ven=(S.ov.venues||[]).find(x=>x.id===e.venue_id)||{};
      const cap=sl.length?Math.min(...sl.map(s=>s.capacity)):"";
      const msg=[
        "*"+e.title+"*",
        "_Hands-on partner training at "+(ven.name||e.venue_name).split(" — ")[0]+", "+e.city+"_",
        "",
        "🗓️ *Schedule*",
        dayLines||"Dates to be announced",
        "",
        "📍 *Venue*",
        (ven.name||e.venue_name),
        (ven.address||"").replace(/,?\s*\n\s*/g,", "),
        ven.map_url?("🧭 "+ven.map_url):"",
        "",
        "🎯 *What you'll get*",
        "▫️ Live demos at our Experience Center",
        "▫️ Hands-on time with "+((["BrightSign","tvONE","Green Hippo"].filter(b=>(e.title+" "+(e.description||"")).toLowerCase().includes(b.toLowerCase())).join(", "))||"the products")+(/brightsign/i.test(e.title)?" players":""),
        "▫️ Q&A with the Cavitak product team",
        "",
        "🎟️ *Only "+cap+" seats per session* — confirmed on approval, with a QR entry pass sent by email.",
        "",
        "👉 *Register here:*",
        link,
        "",
        "— Team Cavitak"
      ].filter((x,i,a)=>!(x===""&&a[i-1]==="")&&x!==null).join("\n").replace(/\n{3,}/g,"\n\n");
      $("#sk_msg").value=msg; $("#sk_wa").href="https://wa.me/?text="+encodeURIComponent(msg);
      $("#sk_mail").href="mailto:?subject="+encodeURIComponent("Invitation: "+e.title)+"&body="+encodeURIComponent(msg.replace(/\*/g,""));
      qrInto($("#sk_qr"), link, 200);
    };
    $("#sk_ch").onchange=upd; $("#sk_custom").oninput=upd; upd();
    $("#sk_copy").onclick=()=>copy($("#sk_link").value);
    $("#sk_cmsg").onclick=()=>copy($("#sk_msg").value);
    $("#sk_wa").addEventListener("click",()=>{ try{ navigator.clipboard.writeText($("#sk_msg").value) }catch(err){} toast("Message also copied — if icons look broken in WhatsApp, select all and paste") });
    $("#sk_png").onclick=()=>{ const a=document.createElement("a"); a.href=qrDataUrl($("#sk_link").value,900); a.download=e.slug+"-register-qr.png"; a.click() };
    $("#sk_print").onclick=()=>window.print();
    $("#openNow") && ($("#openNow").onclick=async ev=>{ ev.preventDefault(); const r=await rpc("tw_set_event_status",{p_token:S.token,p_id:e.id,p_status:"open"}).catch(x=>({ok:false,error:x.message}));
      if(!r.ok) return toast(r.error,true); toast("Registrations are open"); await loadOverview(); shareKit(evById(e.id)); });
  });
}

  S.evView=S.evView||"list";
  v.innerHTML=`${pageHead(ICONS.events,"Events","One event per city / experience center — each with its own room capacity, dates and slots.",can("super")?'<button class="btn primary" id="newev">'+ico("plus",17)+' New event</button>':"")}
    <div class="seg segi" style="margin-bottom:12px"><button data-ev="list" class="${S.evView==="list"?"on":""}">${ico("list",15)} List</button><button data-ev="cal" class="${S.evView==="cal"?"on":""}">${ico("cal",15)} Calendar</button></div>
    <div class="stack" id="ev_body">${S.evView==="cal"?"":ev.length?ev.map(eventCard).join(""):'<div class="card empty">No events yet.</div>'}</div>`;

  $("#newev") && ($("#newev").onclick=()=>editEvent(null));

}
function editEvent(e){
  if(!(S.ov.venues||[]).length){ toast("Add a venue first (Admin → Venues)"); return editVenue(null, ()=>editEvent(e)) }
  const isNew=!e||!e.id; e=e||{status:"draft",auto_approve:false,slots:[],program_id:(S.ov.programs[0]||{}).id,venue_id:(S.ov.venues[0]||{}).id};
  let slots=(e.slots||[]).map(s=>({id:s.id,date:s.local_date,label:s.label,start:s.local_start,end:s.local_end,capacity:s.capacity,approved:s.approved||0,is_active:s.is_active}));
  const venueCap=()=>((S.ov.venues.find(x=>x.id===$("#e_venue").value)||{}).capacity)||8;
  const closesLocal = e.closes_at ? new Date(new Date(e.closes_at).getTime()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16) : "";
  modal(`<h3>${isNew?"New event":"Edit event"}</h3><form id="ef" class="stack">
    <div class="grid g2">
      <div><label class="f">Program</label><select class="in" id="e_prog"><option value="">—</option>${S.ov.programs.map(p=>`<option value="${p.id}" ${p.id===e.program_id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div>
      <div><label class="f">Venue / experience center</label><div class="row" style="flex-wrap:nowrap"><select class="in" id="e_venue">${S.ov.venues.filter(x=>x.is_active||x.id===e.venue_id).map(x=>`<option value="${x.id}" ${x.id===e.venue_id?"selected":""}>${esc(x.city)} — ${esc(x.name)} (${x.capacity} seats)</option>`).join("")}</select><button type="button" class="btn sm" id="e_nv" title="Add venue">+</button></div></div>
    </div>
    <div><label class="f">Event title</label><input class="in" id="e_title" value="${esc(e.title||"")}" placeholder="Cavitak Tech Week — Mumbai"></div>
    <div><label class="f">Brands in this event</label><div class="row" style="gap:8px">${(S.ov.brands||[]).filter(b=>b.is_active||(e.brand_ids||[]).includes(b.id)).map(b=>`<label class="bpick"><input type="checkbox" class="e_b" value="${b.id}" ${(e.brand_ids||[]).includes(b.id)?"checked":""}><span style="--bc:${esc(b.color1)}">${esc(b.name)}</span></label>`).join("")||'<span class="small muted">No brands yet — add them in Admin → Brands.</span>'}</div>
      <div class="tiny muted" style="margin-top:4px">The first ticked brand sets the page colours, perks and certificate line. Tick several for a multi-brand day.</div></div>
    <div class="grid g2"><div><label class="f">Seats per company per session <span class="muted" style="font-weight:400">(optional)</span></label><input class="in" id="e_cap" type="number" min="1" value="${esc(e.company_cap||"")}" placeholder="No limit"><div class="tiny muted">e.g. 2 — stops one partner filling a small room.</div></div></div>
    <div class="grid g2"><div><label class="f">Link name (slug)</label><input class="in" id="e_slug" value="${esc(e.slug||"")}" placeholder="auto from title"></div>
      <div><label class="f">Registrations close <span class="muted" style="font-weight:400">(optional)</span></label><input class="in" type="datetime-local" id="e_close" value="${closesLocal}"></div></div>
    <div><label class="f">Short description (shown on the registration page)</label><textarea class="in" id="e_desc">${esc(e.description||"")}</textarea></div>
    <div><label class="f">Agenda (one line per item)</label><textarea class="in" id="e_agenda" placeholder="10:30 Welcome&#10;10:45 BrightSign hands-on&#10;11:45 tvONE CORIOmaster demo">${esc(e.agenda||"")}</textarea></div>
    <div class="grid g2">
      <div><label class="f">Status</label><select class="in" id="e_status">${["draft","open","closed"].map(s=>`<option value="${s}" ${s===e.status?"selected":""}>${s==="open"?"Open — accepting registrations":s==="draft"?"Draft — link not live":"Closed"}</option>`).join("")}</select></div>
      <div><label class="f">Approval</label><select class="in" id="e_auto"><option value="false" ${!e.auto_approve?"selected":""}>Manual approval (recommended)</option><option value="true" ${e.auto_approve?"selected":""}>Auto-approve until full</option></select></div>
    </div>
    <div class="card pad" style="background:var(--grey-50);box-shadow:none">
      <div class="b">Sessions</div><div class="small muted" style="margin-bottom:8px">Times are local to the venue's time zone. Generate a block of days, then fine-tune any row.</div>
      <div class="grid g4" style="grid-template-columns:repeat(2,1fr)">
        <div><label class="f">From</label><input class="in" type="date" id="g_from" min="${todayStr()}"><div class="tiny muted" id="g_from_l"></div></div><div><label class="f">To</label><input class="in" type="date" id="g_to" min="${todayStr()}"><div class="tiny muted" id="g_to_l"></div></div>
      </div>
      <div id="g_tpl" class="stack" style="margin-top:8px"></div>
      <div class="row" style="margin-top:8px"><button type="button" class="btn sm" id="g_addtpl">+ Slot template</button><label class="small row" style="gap:6px"><input type="checkbox" id="g_wk"> Skip Sat/Sun</label><div class="grow"></div><button type="button" class="btn sm primary" id="g_go">Generate sessions</button></div>
    </div>
    <div class="tscroll"><table class="t" id="s_tbl"><thead><tr><th>Date</th><th>Label</th><th>Start</th><th>End</th><th>Seats</th><th></th></tr></thead><tbody></tbody></table></div>
    <div class="row between"><button type="button" class="btn sm" id="s_add">+ Add one session</button><div class="small b" id="s_sum"></div></div>
    <div id="e_err" class="banner warn hide"></div>
    <div class="row" style="position:sticky;bottom:-18px;background:#fff;padding:10px 0;border-top:1px solid var(--line)">
      <button class="btn primary" id="e_save">Save event</button><button type="button" class="btn" data-close>Cancel</button>
      <div class="grow"></div>${!isNew&&can("super")?'<button type="button" class="btn ghost" id="e_del" style="color:var(--red)">Delete event</button>':""}</div>
  </form>`, m=>{
    const tpl=[{label:"Morning",start:"10:30",end:"13:00"},{label:"Evening",start:"15:00",end:"17:30"}];
    const drawTpl=()=>{ $("#g_tpl").innerHTML=tpl.map((t,i)=>`<div class="row" style="flex-wrap:nowrap;gap:6px">
        <input class="in" data-t="${i}" data-k="label" value="${esc(t.label)}" style="min-width:0"><input class="in" type="time" data-t="${i}" data-k="start" value="${t.start}" style="max-width:120px"><input class="in" type="time" data-t="${i}" data-k="end" value="${t.end}" style="max-width:120px"><button type="button" class="btn sm ghost" data-tr="${i}">✕</button></div>`).join("");
      $$("[data-t]",m).forEach(x=>x.oninput=()=>tpl[x.dataset.t][x.dataset.k]=x.value);
      $$("[data-tr]",m).forEach(x=>x.onclick=()=>{ tpl.splice(+x.dataset.tr,1); drawTpl() }); };
    drawTpl();
    $("#g_addtpl").onclick=()=>{ tpl.push({label:"Session",start:"12:00",end:"14:00"}); drawTpl() };
    const live=()=>slots.filter(s=>!s.remove);
    const slotProblem=(s)=>{
      if(!s.date) return "Pick a date";
      if(!s.id && s.date<todayStr()) return "Date is in the past";
      if(s.start&&s.end&&s.end<=s.start) return "Ends before it starts";
      if(s.date>String(new Date().getFullYear()+2)) return "Check the year";
      const clash=live().find(o=>o!==s&&o.date===s.date&&o.start&&o.end&&s.start&&s.end&&o.start<s.end&&s.start<o.end);
      if(clash) return "Overlaps "+(clash.label||"another session");
      return "";
    };
    const summary=()=>{ const l=live().filter(s=>s.date).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
      const bad=live().filter(slotProblem).length;
      $("#s_sum").innerHTML=l.length?`${l.length} session${l.length>1?"s":""} · ${esc(dayLabel(l[0].date))}${l.length>1&&l[0].date!==l[l.length-1].date?" → "+esc(dayLabel(l[l.length-1].date)):""}${bad?` · <span style="color:var(--red)">${bad} to fix</span>`:""}`:"" };
    const drawSlots=()=>{
      const vis=slots.map((s,i)=>({s,i})).filter(x=>!x.s.remove).sort((a,b)=>(a.s.date+a.s.start).localeCompare(b.s.date+b.s.start));
      $("#s_tbl tbody").innerHTML=vis.length?vis.map(({s,i})=>`<tr>
        <td><input class="in" type="date" data-i="${i}" data-k="date" value="${s.date||""}" ${s.id?"":`min="${todayStr()}"`} style="min-width:140px;${slotProblem(s)?"border-color:var(--red);background:#FFF5F5":""}">
          <div class="tiny" style="color:${slotProblem(s)?"var(--red)":"var(--muted)"};margin-top:2px">${esc(slotProblem(s)||dayLabel(s.date))}</div></td>
        <td><input class="in" data-i="${i}" data-k="label" value="${esc(s.label||"")}" style="min-width:100px"></td>
        <td><input class="in" type="time" data-i="${i}" data-k="start" value="${s.start||""}" style="min-width:100px"></td>
        <td><input class="in" type="time" data-i="${i}" data-k="end" value="${s.end||""}" style="min-width:100px"></td>
        <td><input class="in" type="number" min="1" data-i="${i}" data-k="capacity" value="${s.capacity||8}" style="width:76px">${s.approved?`<div class="tiny muted">${s.approved} booked</div>`:""}</td>
        <td><button type="button" class="btn sm ghost" data-rm="${i}" title="Remove">✕</button></td></tr>`).join(""):`<tr><td colspan="6" class="muted small">No sessions yet — use the generator above.</td></tr>`;
      $$("[data-i]",m).forEach(x=>{ x.oninput=()=>{ slots[x.dataset.i][x.dataset.k]=x.value; summary() }; x.onchange=()=>{ slots[x.dataset.i][x.dataset.k]=x.value; drawSlots() } });
      summary();
      $$("[data-rm]",m).forEach(x=>x.onclick=()=>{ const s=slots[+x.dataset.rm]; if(s.id){ if(s.approved&&!confirm("People are booked in this session. Removing it will cancel their registrations and email them that the session is cancelled when you save. Continue?")) return; s.remove=true } else slots.splice(+x.dataset.rm,1); drawSlots() });
    };
    drawSlots();
    ["g_from","g_to"].forEach(id=>{ $("#"+id).onchange=()=>{ $("#"+id+"_l").textContent=dayLabel($("#"+id).value); if(id==="g_from"&&(!$("#g_to").value||$("#g_to").value<$("#g_from").value)){ $("#g_to").value=$("#g_from").value; $("#g_to_l").textContent=dayLabel($("#g_to").value) } } });
    $("#g_go").onclick=()=>{
      const a=$("#g_from").value, b=$("#g_to").value||a; if(!a) return toast("Pick a start date",true);
      if(a<todayStr()) return toast("The From date is in the past ("+dayLabel(a)+")",true);
      if(b<a) return toast("The To date ("+dayLabel(b)+") is before the From date ("+dayLabel(a)+")",true);
      if((new Date(b)-new Date(a))/864e5>62) return toast("That range is over 2 months — please check the dates",true);
      const badT=tpl.find(t=>!t.start||!t.end||t.end<=t.start); if(badT) return toast(`Template "${badT.label}" ends before it starts`,true);
      let d=new Date(a+"T00:00:00"), end=new Date(b+"T00:00:00"), n=0;
      while(d<=end && n<120){ const dow=d.getDay(); const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
        if(!($("#g_wk").checked&&(dow===0||dow===6))) tpl.forEach(t=>{ if(!slots.some(s=>!s.remove&&s.date===ds&&s.start===t.start)){ slots.push({date:ds,label:t.label,start:t.start,end:t.end,capacity:venueCap()}); n++ } });
        d.setDate(d.getDate()+1) }
      drawSlots(); toast(n+" session"+(n===1?"":"s")+" added");
    };
    $("#s_add").onclick=()=>{ const last=slots.filter(s=>!s.remove).slice(-1)[0]; slots.push({date:last?last.date:"",label:"Session",start:"10:30",end:"13:00",capacity:venueCap()}); drawSlots() };
    $("#e_nv").onclick=()=>editVenue(null, ()=>editEvent(e.id?evById(e.id):null));
    $("#ef").onsubmit=async ev=>{
      ev.preventDefault(); const b=$("#e_save");
      const err=$("#e_err"); err.classList.add("hide");
      const showErr=msg=>{ err.innerHTML=msg; err.classList.remove("hide"); err.scrollIntoView({behavior:"smooth",block:"center"}) };
      const probs=live().map(s=>({s,p:(!s.start||!s.end)?"Missing start or end time":slotProblem(s)})).filter(x=>x.p);
      if(probs.length) return showErr("<b>Please fix these sessions before saving:</b><br>"+probs.map(x=>`• ${esc(x.s.label||"Session")} — ${esc(dayLabel(x.s.date)||"no date")}: ${esc(x.p)}`).join("<br>"));
      if(!live().length && $("#e_status").value==="open") return showErr("Add at least one session before opening registrations.");
      const clv=$("#e_close").value, lastStart=live().map(s=>s.date+"T"+s.start).sort().pop();
      if(clv && lastStart && clv>lastStart) return showErr("Registrations must close before the last session starts.");
      busy(b,true);
      const cl=$("#e_close").value;
      try{
        const r=await rpc("tw_save_event",{p_token:S.token,p_data:{id:e.id||"",program_id:$("#e_prog").value,venue_id:$("#e_venue").value,title:$("#e_title").value,
          slug:$("#e_slug").value,description:$("#e_desc").value,agenda:$("#e_agenda").value,status:$("#e_status").value,auto_approve:$("#e_auto").value==="true",
          closes_at:cl?new Date(cl).toISOString():"",slots:slots.map(s=>({id:s.id||"",date:s.date,label:s.label,start:s.start,end:s.end,capacity:+s.capacity||8,remove:!!s.remove}))}});
        busy(b,false); if(!r.ok) return showErr(esc(r.error));
        await rpc("tw_event_meta",{p_token:S.token,p_id:r.id,p_data:{brand_ids:$$(".e_b:checked").map(x=>x.value),company_cap:$("#e_cap").value}}).catch(()=>{});
        const nt=(r.notified_changed||0)+(r.notified_cancelled||0);
        toast(nt?`Event saved · ${r.notified_changed?r.notified_changed+" told about new timings":""}${r.notified_changed&&r.notified_cancelled?", ":""}${r.notified_cancelled?r.notified_cancelled+" told their session is cancelled":""}`:"Event saved");
        closeModal(); await loadOverview(); go(S.tab);
        if(isNew) shareKit(evById(r.id));
      }catch(ex){ busy(b,false); showErr(esc(ex.message)) }
    };
    $("#e_del") && ($("#e_del").onclick=()=>{
      const n=(e.counts&&e.counts.total)||0, act=(e.counts?(e.counts.pending+e.counts.approved+e.counts.waitlisted):0);
      const doIt=async(mode,reason)=>{ const r=await rpc("tw_delete_event",{p_token:S.token,p_id:e.id,p_mode:mode,p_reason:reason||null}).catch(x=>({ok:false,error:x.message}));
        if(!r.ok) return toast(r.error||"Could not delete",true);
        toast(r.mode==="cancelled"?`Event cancelled · ${r.notified} participant${r.notified===1?"":"s"} notified by email`:"Event deleted");
        closeModal(); await loadOverview(); go(S.tab) };
      if(!n){ if(confirm(`Delete "${e.title}" and its sessions? This cannot be undone.`)) doIt("auto"); return }
      modal(`<h3>Remove "${esc(e.title)}"</h3><div class="stack">
        <div class="banner warn">This event has <b>${n}</b> registration${n===1?"":"s"} (${act} still active).</div>
        <div class="card pad stack" style="box-shadow:none"><div class="b">Cancel the event and notify participants <span class="chip approved">Recommended</span></div>
          <div class="small muted">Everyone still registered gets a cancellation email (with a calendar cancellation). The event disappears from the console and the link stops working; records are kept for reports.</div>
          <div><label class="f">Message to participants (optional)</label><input class="in" id="dx_r" placeholder="e.g. Due to unforeseen circumstances — new dates will be shared soon."></div>
          <button class="btn primary" id="dx_cancel">Cancel event & email ${act} participant${act===1?"":"s"}</button></div>
        <div class="card pad stack" style="box-shadow:none"><div class="b">Delete permanently, no emails</div>
          <div class="small muted">Only for test or dummy events. Removes the event, sessions and all registrations for good.</div>
          <button class="btn" id="dx_purge" style="color:var(--red)">Delete permanently</button></div>
        <div class="row"><button class="btn ghost" data-close>Keep the event</button></div></div>`, ()=>{
        $("#dx_cancel").onclick=()=>{ if(confirm(`Cancel "${e.title}" and email ${act} participant(s)? This cannot be undone.`)) doIt("cancel_notify",$("#dx_r").value) };
        $("#dx_purge").onclick=()=>{ const t=prompt("Type DELETE to permanently remove this event and all its registrations (no emails will be sent):"); if(t==="DELETE") doIt("purge"); else toast("Not deleted") };
      });
    });
  });
}

/* ---------------- Approvals ---------------- */
async function loadRegs(eventId){
  const r=await rpc("tw_registrations",{p_token:S.token,p_event_id:eventId||null});
  S.regs=r.rows||[]; S.regsEvent=eventId||null; return S.regs;
}
async function viewApprovals(v){
  const ev=S.ov.events||[];
  if(!ev.length){ v.innerHTML='<div class="card empty">No events yet.</div>'; return }
  if(!S.apprEvent || !evById(S.apprEvent)) S.apprEvent=(ev.find(e=>e.counts.pending)||ev.find(e=>e.status==="open")||ev[0]).id;
  S.apprStatus=S.apprStatus||"pending";
  v.innerHTML=`${pageHead(ICONS.approvals,"Approvals","Approve, waitlist or move registrations — the partner gets an email automatically.",'<button class="btn sm" id="ap_ref">'+ico("refresh",15)+' Refresh</button>')}
    <div class="stack"><select class="in" id="ap_ev">${ev.map(e=>`<option value="${e.id}" ${e.id===S.apprEvent?"selected":""}>${esc(e.city)} — ${esc(e.title)}${e.counts.pending?` (${e.counts.pending} pending)`:""}</option>`).join("")}</select>
    <div id="ap_body"><div class="empty"><span class="spin dark"></span></div></div></div>`;
  $("#ap_ev").onchange=()=>{ S.apprEvent=$("#ap_ev").value; S.apprSlot=""; drawApprovals() };
  $("#ap_ref").onclick=async()=>{ await loadOverview(); drawApprovals() };
  drawApprovals();
}
async function drawApprovals(){
  const body=$("#ap_body"); if(!body) return;
  const e=evById(S.apprEvent);
  try{ await loadRegs(S.apprEvent) }catch(ex){ body.innerHTML=`<div class="banner warn">${esc(ex.message)}</div>`; return }
  const st=S.apprStatus, q=(S.apprQ||"").toLowerCase(), sl=S.apprSlot||"";

}

async function uploadTargets(ev){
  const f=ev.target.files[0]; ev.target.value=""; if(!f) return;
  try{ await loadScript("https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js") }catch(e){ return toast(e.message,true) }
  const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
  const pick=(r,keys)=>{ for(const k of Object.keys(r)){ const n=k.toLowerCase().replace(/[^a-z]/g,""); if(keys.some(x=>n.includes(x))) return String(r[k]).trim() } return "" };
  const data=rows.map(r=>({organization:pick(r,["organisation","organization","company","partner","firm"]),contact_name:pick(r,["contact","name"]),email:pick(r,["email","mail"]),
    phone:pick(r,["phone","mobile"]),city:pick(r,["city","location","region"]),owner:pick(r,["owner","sales","account"]),notes:pick(r,["note","remark"])})).filter(r=>r.organization);
  if(!data.length) return toast("No rows with an Organisation column found",true);
  const replace=confirm(`${data.length} target partners found.\n\nOK = replace the existing target list for this program\nCancel = add to the existing list`);
  try{ const r=await rpc("tw_targets_import",{p_token:S.token,p_program_id:S.repProg,p_rows:data,p_replace:replace}); toast(r.ok?r.imported+" targets imported":r.error,!r.ok); drawCoverage() }catch(e){ toast(e.message,true) }
}

const PERIODS=[["all","All time"],["q","This quarter"],["lq","Last quarter"],["fy","This financial year"],["lfy","Last financial year"]];
function periodRange(k){
  const d=new Date(), y=d.getFullYear(), m=d.getMonth(); const iso=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  const qs=Math.floor(m/3)*3;
  if(k==="q") return [iso(new Date(y,qs,1)),iso(new Date(y,qs+3,0))];
  if(k==="lq") return [iso(new Date(y,qs-3,1)),iso(new Date(y,qs,0))];
  const fy=m>=3?y:y-1;
  if(k==="fy") return [fy+"-04-01",(fy+1)+"-03-31"];
  if(k==="lfy") return [(fy-1)+"-04-01",fy+"-03-31"];
  return [null,null];
}
function repMatch(r){
  if(S.repEvent&&r.event_id!==S.repEvent) return false;
  if(S.repBrand==="none"&&(r.brand_ids||[]).length) return false;
  if(S.repBrand&&S.repBrand!=="none"&&!(r.brand_ids||[]).includes(S.repBrand)) return false;
  const [a,b]=periodRange(S.repPeriod||"all"); const d=String(r.slot_starts_at||"").slice(0,10);
  if(a&&d<a) return false; if(b&&d>b) return false;
  return true;
}

      <td><input class="in" inputmode="numeric" data-ld="${r.id}" data-k="lead_value" value="${esc(r.lead_value||"")}" style="min-height:34px;width:110px"></td></tr>`).join("")}</tbody></table>`
      :'<div class="empty">No attendees here yet — leads appear once people are checked in.</div>'}</div>`;

      const rows=S.regs.filter(r=>r.status==="approved"&&String(r.slot_starts_at).length&&e.slots.find(s=>s.id===r.slot_id&&s.local_date===d)).sort((a,b)=>a.slot_starts_at.localeCompare(b.slot_starts_at)||a.full_name.localeCompare(b.full_name));
      printSheet("Visitors "+d,`<h1>Visitor list — ${esc(dayLabel(d))}</h1><div class="m">${esc(e.venue_name)}, ${esc(e.city)} · ${esc(e.title)} · ${rows.length} visitors · host: Cavitak</div>
        <table><tr><th>#</th><th>Name</th><th>Organisation</th>${$("#vl_ph").checked?"<th>Mobile</th>":""}<th>Session</th><th>In time</th><th>Sign</th></tr>
        ${rows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.full_name)}</b><br><small>${esc(r.designation||"")}</small></td><td>${esc(r.organization)}</td>${$("#vl_ph").checked?`<td>${esc(r.phone)}</td>`:""}<td>${esc(r.slot_label)}<br><small>${esc(r.slot_time)}</small></td><td></td><td></td></tr>`).join("")||'<tr><td colspan="7">No approved visitors for this day.</td></tr>'}</table>`) };
  });
}
function printBadges(list,e){
  if(!list.length) return toast("No approved attendees in this session",true);
  const b=brandById(((e||{}).brand_ids||[])[0]), col=b?b.color2:"#8E1219";
  const html=`<div class="sheet">${list.map(r=>`<div class="bd"><div class="t" style="background:${esc(col)}">Cavitak${b?" × "+esc(b.name):""} · Tech Week</div>
    <div class="c"><div style="flex:1"><div class="n">${esc(r.full_name)}</div><div class="o">${esc(r.designation||"")}</div><div class="o"><b>${esc(r.organization)}</b></div></div>
    <div class="q">${r.pass_token?`<img src="${qrDataUrl(regLinkPass(r.pass_token),300)}">`:""}</div></div></div>`).join("")}</div>`;
  printSheet("Badges",html);
}
const regLinkPass=tok=>baseUrl().split("?")[0]+"?p="+tok;

if(params.has("e")) renderRegister();
else if(params.has("p")) renderPass();

else if(params.has("f")) renderFeedback();
else if(params.has("v")) renderVerify();
else if(params.has("privacy")) renderPrivacy();
else if(params.has("x")) renderErase();
else bootConsole();
