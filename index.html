<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cavitak Tech Week</title>
<meta name="theme-color" content="#C8232C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C8232C;--red-d:#A51B23;--red-50:#FDF1F2;--ink:#14171A;--ink-2:#3A4149;--muted:#6B7480;--line:#E4E7EB;--line-2:#EEF0F3;
  --bg:#F5F6F8;--card:#FFFFFF;--green:#16794A;--green-50:#E9F7EF;--amber:#B26A00;--amber-50:#FFF5E1;--blue:#1F5FBF;--blue-50:#EAF1FD;
  --grey-50:#F1F3F5;--r:12px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--red)}
h1,h2,h3{margin:0;line-height:1.25}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.stack>*+*{margin-top:12px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.b{font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);min-height:40px}
.btn:hover{background:var(--grey-50)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.primary:hover{background:var(--red-d)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.in{width:100%;border:1px solid #D3D8DE;border-radius:10px;padding:10px 12px;background:#fff;min-height:42px}
.in:focus{outline:2px solid rgba(200,35,44,.25);border-color:var(--red)}
textarea.in{min-height:84px;resize:vertical}
.grid{display:grid;gap:12px}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--grey-50);color:var(--ink-2);white-space:nowrap}
.chip.pending{background:var(--amber-50);color:var(--amber)}.chip.approved{background:var(--green-50);color:var(--green)}
.chip.waitlisted{background:var(--blue-50);color:var(--blue)}.chip.rejected,.chip.cancelled{background:#F4F4F5;color:#71717A}
.chip.open{background:var(--green-50);color:var(--green)}.chip.draft{background:var(--grey-50);color:var(--muted)}.chip.closed{background:#F4F4F5;color:#52525B}
.chip.in{background:var(--green);color:#fff}
.bar{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--red);border-radius:99px}
.kpi{padding:14px 16px}.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em}.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:#9B1C22}
.modal-bg{position:fixed;inset:0;background:rgba(15,18,22,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:720px){.modal-bg{align-items:center}}
.modal{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
@media(min-width:720px){.modal{border-radius:16px}}
.modal{position:relative}
.modal h3{font-size:18px;margin-bottom:12px;padding-right:36px}
.mclose{position:sticky;top:0;float:right;margin:-6px -6px 0 0;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;color:var(--muted);z-index:2}
.mclose:hover{background:var(--grey-50);color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}
.spin.dark{border-color:#0002;border-top-color:var(--red)}
@keyframes s{to{transform:rotate(360deg)}}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* ---------- public pages ---------- */
.hero{background:linear-gradient(135deg,#C8232C 0%,#8E1219 100%);color:#fff;padding:28px 0 64px}
.hero .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:600}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:6px 0 8px}
@media(min-width:640px){.hero h1{font-size:36px}}
.lift{margin-top:-44px}
.slotday{margin-top:14px}.slotday h4{margin:0 0 8px;font-size:14px;color:var(--ink-2)}
.slots{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:520px){.slots{grid-template-columns:1fr 1fr}}
.slot{border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff;text-align:left;width:100%}
.slot:hover{border-color:#C9CED4}
.slot.sel{border-color:var(--red);background:var(--red-50);box-shadow:0 0 0 3px rgba(200,35,44,.12)}
.slot.dis{opacity:.45;cursor:not-allowed}
.slot .tt{font-weight:700}.slot .seats{font-size:12px;font-weight:600;margin-top:4px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);background:var(--grey-50);padding:12px;border-radius:10px}
.consent input{margin-top:3px;width:18px;height:18px;accent-color:var(--red);flex:none}
.hp{position:absolute;left:-5000px}
.qrbox{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:12px;border:1px dashed #CBD1D8}
.qrbox img,.qrbox canvas{width:220px!important;height:220px!important}
.foot{padding:26px 0 40px;text-align:center;color:var(--muted);font-size:12px}
/* ---------- console ---------- */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.01em}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--red);display:grid;place-items:center;color:#fff;font-style:normal;font-size:14px}
.tabs{display:none;gap:4px;margin-left:12px}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--red-50);color:var(--red)}
@media(min-width:900px){.tabs{display:flex}.bnav{display:none!important}}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.bnav button svg{width:22px;height:22px}
.bnav button.on{color:var(--red)}
main.console{padding:16px 0 96px}
@media(min-width:900px){main.console{padding-bottom:40px}}
.ev{padding:14px 16px}
.ev h3{font-size:16px}
.reg{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.reg:last-child{border-bottom:0}
.reg input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--red);flex:none}
.reg .nm{font-weight:700}
.sticky-actions{position:sticky;bottom:72px;z-index:10;margin-top:10px}
@media(min-width:900px){.sticky-actions{bottom:12px}}
.scanres{border-radius:14px;padding:16px;color:#fff}
.scanres.ok{background:var(--green)}.scanres.warn{background:var(--amber)}.scanres.bad{background:#9B1C22}
.scanres .big{font-size:22px;font-weight:800}
#reader{width:100%;max-width:420px;margin:0 auto;border-radius:12px;overflow:hidden;background:#000}
.banner{border-radius:12px;padding:12px 14px;font-size:14px}
.banner.warn{background:var(--amber-50);color:#6B4200;border:1px solid #F3D9A4}
.banner.info{background:var(--blue-50);color:#173E7A;border:1px solid #C9DAF6}
.poster{width:100%;max-width:420px;margin:0 auto;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.poster .ph{background:linear-gradient(135deg,#C8232C,#8E1219);color:#fff;padding:20px}
.poster .pb{padding:18px;text-align:center}
.minibars .r{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.minibars .r span:first-child{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minibars .r .bar{flex:1}
@media print{body *{visibility:hidden}.printable,.printable *{visibility:visible}.printable{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div id="app"><div class="empty"><span class="spin dark"></span></div></div>
<div id="modal-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* =============================================================
   Cavitak Tech Week — registration, approvals, QR check-in
   Backend: Supabase project "cavitak-tech-week" (all access via
   secured RPC functions; tables are not directly readable).
   ============================================================= */
const SB_URL = "https://nnointygnobmivjaebcr.supabase.co";
const SB_KEY = "sb_publishable_9-cHSg4bFAULoCUAys9hFg__KuBvmGW";
const APP_VERSION = "1.1.1";

/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params = new URLSearchParams(location.search);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v) }catch(e){} }
};
function toast(msg, err=false){
  const t=document.createElement("div"); t.className="toast"+(err?" err":""); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), err?4800:2600);
}
async function rpc(fn, args = {}){
  const res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method:"POST", headers:{ "apikey":SB_KEY, "Content-Type":"application/json" }, body:JSON.stringify(args)
  });
  const txt = await res.text(); let data; try{ data = txt ? JSON.parse(txt) : null }catch(e){ data = txt }
  if(!res.ok){
    const msg = (data && (data.message || data.hint)) || ("Request failed ("+res.status+")");
    if(/not_authenticated/.test(msg)){ S.token=null; store.set("tw_token",null); if(!isPublic) renderLogin("Your session has expired. Please sign in again."); }
    throw new Error(msg);
  }
  return data;
}
function fmtDT(iso){ if(!iso) return ""; const d=new Date(iso); return d.toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"numeric",minute:"2-digit"}) }
function fmtD(iso){ if(!iso) return ""; return new Date(iso).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) }
function baseUrl(){
  const s = S.settings && S.settings.public_url;
  if(s) return s.split("#")[0].split("?")[0];
  return location.origin + location.pathname;
}
function regLink(slug, src){ return baseUrl()+"?e="+encodeURIComponent(slug)+(src?"&src="+encodeURIComponent(src):"") }
function passLink(tok){ return baseUrl()+"?p="+tok }
function copy(text){
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(()=>toast("Copied")).catch(()=>{
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Copied") }catch(e){ toast("Copy failed", true) } ta.remove();
  });
}
function loadScript(src){
  return new Promise((ok, bad)=>{ if($$(`script[src="${src}"]`).length) return ok();
    const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>bad(new Error("Could not load "+src)); document.head.appendChild(s); });
}
function qrInto(el, text, size=220){
  el.innerHTML=""; new QRCode(el, { text, width:size, height:size, correctLevel: QRCode.CorrectLevel.M });
}
function qrDataUrl(text, size=600){
  const d=document.createElement("div"); new QRCode(d,{text,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});
  const c=d.querySelector("canvas"); return c ? c.toDataURL("image/png") : (d.querySelector("img")||{}).src;
}
function download(name, content, type){
  const blob = content instanceof Blob ? content : new Blob([content],{type});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove()},500);
}
function modal(html, onMount){
  const root=$("#modal-root");
  root.innerHTML=`<div class="modal-bg"><div class="modal" role="dialog"><button type="button" class="mclose" aria-label="Close" title="Close">✕</button>${html}</div></div>`;
  const bg=root.firstElementChild, box=bg.firstElementChild;
  let dirty=false;
  const mark=e=>{ if(e.target.closest && e.target.closest("form")) dirty=true };
  box.addEventListener("input", mark, true); box.addEventListener("change", mark, true);
  // Closing by tapping outside / Esc / ✕ never silently throws away typed changes
  const tryClose=()=>{ if(!dirty || confirm("You have unsaved changes. Close without saving?")) closeModal() };
  bg.addEventListener("click", e=>{ if(e.target===bg) tryClose() });
  $(".mclose", box).onclick=tryClose;
  $$("[data-close]", bg).forEach(b=>b.onclick=tryClose);
  window._modalEsc=e=>{ if(e.key==="Escape") tryClose() }; document.addEventListener("keydown", window._modalEsc);
  onMount && onMount(box);
  dirty=false; // values filled in by onMount don't count as edits
  return box;
}
function closeModal(){ $("#modal-root").innerHTML=""; if(window._modalEsc){ document.removeEventListener("keydown", window._modalEsc); window._modalEsc=null } }
function busy(btn, on){ if(!btn) return; if(on){ btn.dataset.t=btn.innerHTML; btn.innerHTML='<span class="spin"></span>'; btn.disabled=true } else { btn.innerHTML=btn.dataset.t||btn.innerHTML; btn.disabled=false } }
const STATUS_LABEL={pending:"Pending",approved:"Approved",waitlisted:"Waitlisted",rejected:"Rejected",cancelled:"Cancelled"};
const chip=(s)=>`<span class="chip ${esc(s)}">${esc(STATUS_LABEL[s]||s)}</span>`;
const PARTNER_TYPES=["System Integrator","AV Consultant","Reseller / Dealer","End customer","Architect / Designer","OEM / Technology partner","Other"];

const isPublic = params.has("e") || params.has("p") || params.has("c") || params.has("d");
const S = { token: store.get("tw_token"), user:null, ov:null, settings:{}, tab: store.get("tw_tab") || "dash", regs:[], regsEvent:null };

/* =============================================================
   PUBLIC — registration page
   ============================================================= */
async function renderRegister(){
  const slug = params.get("e"), src = params.get("src") || params.get("utm_source") || "";
  const app=$("#app");
  let d; try{ d = await rpc("tw_public_event",{p_slug:slug}) }catch(e){ d={ok:false,error:e.message} }
  if(!d.ok){ app.innerHTML=publicShell(`<div class="card pad empty"><h2 style="color:var(--ink)">Link not active</h2><p>${esc(d.error)}</p></div>`); return }
  const ev=d.event, v=d.venue; document.title = ev.title + " — Register";
  const byDay={}; d.slots.forEach(s=>{ (byDay[s.local_date]=byDay[s.local_date]||{label:s.date_label,items:[]}).items.push(s) });
  const dates = d.slots.length ? (d.slots[0].date_label.split(",").slice(1).join(",").trim() + (d.slots.length>1 && d.slots[0].local_date!==d.slots[d.slots.length-1].local_date ? " – "+d.slots[d.slots.length-1].date_label.split(",").slice(1).join(",").trim() : "")) : "";
  const slotsHtml = Object.keys(byDay).sort().map(k=>`<div class="slotday"><h4>${esc(byDay[k].label)}</h4><div class="slots">${
    byDay[k].items.map(s=>{
      const full=s.seats_left<=0, dis=s.past;
      return `<button type="button" class="slot ${dis?"dis":""}" data-id="${s.id}" ${dis?"disabled":""}>
        <div class="tt">${esc(s.label)}</div><div class="small muted">${esc(s.time_label)}</div>
        <div class="seats" style="color:${dis?"var(--muted)":full?"var(--blue)":s.seats_left<=2?"var(--amber)":"var(--green)"}">${dis?"Session closed":full?"Full · join waitlist":s.seats_left+" of "+s.capacity+" seats left"}</div></button>`}).join("")
  }</div></div>`).join("");
  const venueCard = `<div class="card pad">
      <div class="small muted b" style="text-transform:uppercase;letter-spacing:.05em">Venue</div>
      <div class="b" style="font-size:17px;margin-top:2px">${esc(v.name)}${v.room_name?` · <span class="muted" style="font-weight:500">${esc(v.room_name)}</span>`:""}</div>
      <div class="small" style="margin-top:4px;white-space:pre-line">${esc(v.address)}</div>
      ${v.map_url?`<a class="btn sm" style="margin-top:10px" href="${esc(v.map_url)}" target="_blank" rel="noopener">Open in Google Maps</a>`:""}
      ${v.instructions?`<div class="small muted" style="margin-top:10px">${esc(v.instructions)}</div>`:""}
    </div>`;
  const formHtml = !d.open ? `<div class="card pad empty"><h3 style="color:var(--ink)">Registrations are closed</h3><p>Please contact your Cavitak representative for upcoming sessions.</p></div>` : `
  <form id="rf" class="card pad stack" novalidate>
    <div><h2 style="font-size:20px">Register</h2><div class="small muted">Seats are limited to the room capacity. Every request is reviewed and you'll receive a confirmation email with your entry QR pass.</div></div>
    <div><label class="f">1. Choose your session</label>${slotsHtml||'<div class="muted">No sessions available.</div>'}</div>
    <div class="grid g2">
      <div><label class="f" for="f_name">Full name *</label><input class="in" id="f_name" autocomplete="name" required maxlength="120"></div>
      <div><label class="f" for="f_desig">Designation *</label><input class="in" id="f_desig" autocomplete="organization-title" required maxlength="120"></div>
      <div><label class="f" for="f_org">Organisation *</label><input class="in" id="f_org" autocomplete="organization" required maxlength="160"></div>
      <div><label class="f" for="f_type">Organisation type</label><select class="in" id="f_type"><option value="">Select</option>${PARTNER_TYPES.map(t=>`<option>${t}</option>`).join("")}</select></div>
      <div><label class="f" for="f_email">Work email *</label><input class="in" id="f_email" type="email" autocomplete="email" required maxlength="160"></div>
      <div><label class="f" for="f_phone">Mobile *</label><input class="in" id="f_phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="20" placeholder="+91"></div>
      <div><label class="f" for="f_city">City</label><input class="in" id="f_city" autocomplete="address-level2" maxlength="80"></div>
      <div><label class="f" for="f_int">What would you like to learn? <span class="muted" style="font-weight:400">(optional)</span></label><input class="in" id="f_int" maxlength="300" placeholder="e.g. BrightSign players, tvONE processors"></div>
    </div>
    <input class="hp" id="f_web" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label class="consent"><input type="checkbox" id="f_consent"><span>I agree that Cavitak Marketing Pvt. Ltd. may use the details above to manage my registration for this training, send me event communication, and record my attendance. My data will not be sold or shared outside Cavitak and its brand partners for this program. I can ask for it to be deleted at any time by replying to any event email.</span></label>
    <div id="rf_err" class="banner warn hide"></div>
    <button class="btn primary block" id="rf_go" type="submit" style="min-height:48px;font-size:16px">Submit registration</button>
  </form>`;
  app.innerHTML = `
  <div class="hero"><div class="wrap">
    <div class="eyebrow">${esc(d.brand||"Cavitak")} · Tech Week · ${esc(v.city)}</div>
    <h1>${esc(ev.title)}</h1>
    <div style="opacity:.92">${esc(dates)}${dates?" · ":""}${esc(v.name)}, ${esc(v.city)}</div>
  </div></div>
  <div class="wrap lift"><div class="grid" style="grid-template-columns:1fr;gap:14px">

        : r.status==="waitlisted" ? {h:"You're on the waitlist",p:"This session is currently full. We'll email you as soon as a seat opens."}

function evDates(e){ const sl=(e.slots||[]).filter(s=>s.is_active); if(!sl.length) return "No sessions yet";

        <td><button type="button" class="btn sm ghost" data-rm="${i}" title="Remove">✕</button></td></tr>`).join(""):`<tr><td colspan="6" class="muted small">No sessions yet — use the generator above.</td></tr>`;
      $$("[data-i]",m).forEach(x=>x.oninput=()=>slots[x.dataset.i][x.dataset.k]=x.value);

        if(!($("#g_wk").checked&&(dow===0||dow===6))) tpl.forEach(t=>{ if(!slots.some(s=>!s.remove&&s.date===ds&&s.start===t.start)){ slots.push({date:ds,label:t.label,start:t.start,end:t.end,capacity:venueCap()}); n++ } });
        d.setDate(d.getDate()+1) }

    };
    $("#s_add").onclick=()=>{ const last=slots.filter(s=>!s.remove).slice(-1)[0]; slots.push({date:last?last.date:"",label:"Session",start:"10:30",end:"13:00",capacity:venueCap()}); drawSlots() };
    $("#e_nv").onclick=()=>editVenue(null, ()=>editEvent(e.id?evById(e.id):null));
    $("#ef").onsubmit=async ev=>{
      ev.preventDefault(); const b=$("#e_save");
      for(const s of slots){ if(s.remove) continue; if(!s.date||!s.start||!s.end) return toast("Every session needs a date, start and end time",true); if(s.end<=s.start) return toast(`"${s.label}" on ${s.date} ends before it starts`,true) }
      busy(b,true);
      const cl=$("#e_close").value;
      try{
        const r=await rpc("tw_save_event",{p_token:S.token,p_data:{id:e.id||"",program_id:$("#e_prog").value,venue_id:$("#e_venue").value,title:$("#e_title").value,
          slug:$("#e_slug").value,description:$("#e_desc").value,agenda:$("#e_agenda").value,status:$("#e_status").value,auto_approve:$("#e_auto").value==="true",
          closes_at:cl?new Date(cl).toISOString():"",slots:slots.map(s=>({id:s.id||"",date:s.date,label:s.label,start:s.start,end:s.end,capacity:+s.capacity||8,remove:!!s.remove}))}});
        busy(b,false); if(!r.ok) return toast(r.error,true);
        toast("Event saved"); closeModal(); await loadOverview(); go(S.tab);
        if(isNew) shareKit(evById(r.id));
      }catch(ex){ busy(b,false); toast(ex.message,true) }
    };
  });
}

async function decide(ids, act, extra={}){
  if(!ids.length) return;
  const e=evById(S.apprEvent);
  if(act==="reject" && extra.reason===undefined){
    return modal(`<h3>Reject ${ids.length} registration${ids.length>1?"s":""}</h3><div class="stack"><div><label class="f">Reason (included in the email, optional)</label>
      <input class="in" id="rj_r" placeholder="e.g. Sessions are reserved for system integrators this week"></div>
      <label class="small row"><input type="checkbox" id="rj_n" checked> Send email to the registrant</label>
      <div class="row"><button class="btn primary" id="rj_go">Reject</button><button class="btn" data-close>Cancel</button></div></div>`, ()=>{
      $("#rj_go").onclick=()=>{ const reason=$("#rj_r").value, notify=$("#rj_n").checked; closeModal(); decide(ids,"reject",{reason,notify}) } });
  }
  if(act==="move" && !extra.slot){
    return modal(`<h3>Move to another session</h3><div class="stack"><select class="in" id="mv_s">${e.slots.filter(s=>s.is_active&&!s.past).map(s=>`<option value="${s.id}">${esc(s.date_label)} · ${esc(s.label)} (${s.seats_left} left)</option>`).join("")}</select>
      <div class="small muted">Approved people get an updated confirmation with the new date and time.</div>
      <div class="row"><button class="btn primary" id="mv_go">Move</button><button class="btn" data-close>Cancel</button></div></div>`, ()=>{
      $("#mv_go").onclick=()=>{ const slot=$("#mv_s").value; closeModal(); decide(ids,"move",{slot}) } });
  }
  try{
    const r=await rpc("tw_decide",{p_token:S.token,p_ids:ids,p_action:act,p_reason:extra.reason||null,p_slot:extra.slot||null,p_notify:extra.notify!==false});
    if(!r.ok) return toast(r.error,true);
    toast(`${r.done} updated${r.full?` · ${r.full} skipped (session full)`:""}${act==="approve"&&r.done?" · confirmations sent":""}`, !!r.full && !r.done);
    await loadOverview(); drawApprovals();
  }catch(ex){ toast(ex.message,true) }
}

async function viewCheckin(v){

  if(!S.ciEvent||!evById(S.ciEvent)){ S.ciEvent=(ev.map(e=>({e,s:nearest(e)})).filter(x=>x.s).sort((a,b)=>Math.abs(new Date(a.s.starts_at)-now)-Math.abs(new Date(b.s.starts_at)-now))[0]||{e:ev[0]}).e.id }

      <select class="in" id="ci_sl">${e.slots.filter(s=>s.is_active).map(s=>`<option value="${s.id}" ${s.id===S.ciSlot?"selected":""}>${esc(s.date_label)} · ${esc(s.label)}</option>`).join("")}</select></div>
    <div class="card pad" style="text-align:center"><div id="ci_count" class="b" style="font-size:18px"></div>
      <div id="reader" class="hide" style="margin-top:10px"></div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" id="ci_scan" style="min-height:52px;font-size:16px;padding:0 26px">📷 Start scanning</button></div>
      <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input class="in" id="ci_code" placeholder="…or paste pass link / code"><button class="btn" id="ci_go">Check</button></div></div>
    <div id="ci_res"></div>
    <div class="card"><div class="pad row between" style="padding-bottom:6px"><div class="b">Attendee list</div><input class="in" id="ci_q" placeholder="Search" style="max-width:200px;min-height:36px"></div><div id="ci_list"><div class="empty"><span class="spin dark"></span></div></div></div>
   </div>`;

function drawCiList(){

async function setAtt(id, present, btn){
  const r=S.regs.find(x=>x.id===id);
  if(present && r.status!=="approved" && !confirm(`${r.full_name} is ${r.status}. Approve and check in now?`)) return;
  busy(btn,true);
  try{ const x=await rpc("tw_set_attendance",{p_token:S.token,p_reg:id,p_present:present}); if(!x.ok){ busy(btn,false); return toast(x.error,true) }
    await loadRegs(S.ciEvent); drawCiList(); toast(present?"Checked in":"Check-in undone"); loadOverview().catch(()=>{}) }
  catch(e){ busy(btn,false); toast(e.message,true) }
}
let _lastScan="", _lastScanAt=0;
async function toggleScanner(){
  const btn=$("#ci_scan"), reader=$("#reader");
  if(window._scanner){ try{ await window._scanner.stop() }catch(e){} window._scanner=null; reader.classList.add("hide"); btn.textContent="📷 Start scanning"; return }
  try{
    await loadScript("https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js");
    reader.classList.remove("hide"); btn.textContent="Stop scanning";
    const sc=new Html5Qrcode("reader"); window._scanner=sc;
    await sc.start({facingMode:"environment"},{fps:10,qrbox:{width:240,height:240}},txt=>{
      const now=Date.now(); if(txt===_lastScan && now-_lastScanAt<4000) return; _lastScan=txt; _lastScanAt=now; doCheckin(txt);
    },()=>{});
  }catch(e){ window._scanner=null; reader.classList.add("hide"); btn.textContent="📷 Start scanning";
    toast("Camera not available: "+(e.message||e)+". Allow camera access, or type the code.",true) }
}
async function doCheckin(code, force=false){
  code=(code||"").trim(); if(!code) return;
  const res=$("#ci_res");
  try{
    const r=await rpc("tw_checkin",{p_token:S.token,p_pass:code,p_event_id:S.ciEvent,p_force:force});
    const p=r.person||{};
    const cls=r.code==="checked_in"?"ok":r.code==="already"?"warn":"bad";
    const head={checked_in:"✓ Welcome!",already:"Already checked in",not_found:"QR not recognised",wrong_event:"Different event",not_approved:"Not approved"}[r.code]||r.message;
    res.innerHTML=`<div class="scanres ${cls}"><div class="big">${esc(head)}</div>${p.full_name?`<div style="font-size:18px;font-weight:700;margin-top:4px">${esc(p.full_name)}</div>

    <div class="grid g2"><div><label class="f">Experience center name</label><input class="in" id="v_n" value="${esc(v.name||"")}" placeholder="Cavitak Bay"></div>
      <div><label class="f">City</label><input class="in" id="v_c" value="${esc(v.city||"")}" placeholder="Mumbai"></div></div>
    <div><label class="f">Full address (shown in emails)</label><textarea class="in" id="v_a">${esc(v.address||"")}</textarea></div>
    <div><label class="f">Google Maps link</label><input class="in" id="v_m" value="${esc(v.map_url||"")}" placeholder="https://maps.app.goo.gl/..."></div>
    <div class="grid g3"><div><label class="f">Room</label><input class="in" id="v_r" value="${esc(v.room_name||"")}" placeholder="Training room"></div>
      <div><label class="f">Seating capacity</label><input class="in" type="number" min="1" id="v_cap" value="${v.capacity}"></div>
      <div><label class="f">Time zone</label><select class="in" id="v_tz">${[...new Set([v.timezone,...TZ])].map(t=>`<option ${t===v.timezone?"selected":""}>${t}</option>`).join("")}</select></div></div>
    <div class="grid g2"><div><label class="f">On-site contact</label><input class="in" id="v_cn" value="${esc(v.contact_name||"")}"></div><div><label class="f">Contact phone</label><input class="in" id="v_cp" value="${esc(v.contact_phone||"")}"></div></div>
    <div><label class="f">Instructions for attendees</label><textarea class="in" id="v_i" placeholder="Parking, photo ID, reporting time…">${esc(v.instructions||"")}</textarea></div>
    ${!isNew?`<label class="small row"><input type="checkbox" id="v_ac" ${v.is_active?"checked":""}> Active</label>`:""}
    <div class="row"><button class="btn primary" id="v_go">Save venue</button><button type="button" class="btn" data-close>Cancel</button></div></form>`);
  $("#vf").onsubmit=async e=>{ e.preventDefault(); const bt=$("#v_go"); busy(bt,true);
    try{ const r=await rpc("tw_save_venue",{p_token:S.token,p_data:{id:v.id||"",name:$("#v_n").value,city:$("#v_c").value,address:$("#v_a").value,map_url:$("#v_m").value,room_name:$("#v_r").value,
        capacity:+$("#v_cap").value,timezone:$("#v_tz").value,contact_name:$("#v_cn").value,contact_phone:$("#v_cp").value,instructions:$("#v_i").value,is_active:isNew?true:$("#v_ac").checked}});
      busy(bt,false); if(!r.ok) return toast(r.error,true); toast("Venue saved"); closeModal(); await loadOverview(); after&&after() }
    catch(ex){ busy(bt,false); toast(ex.message,true) } };
}
function adPrograms(b){
  const ps=S.ov.programs||[];
  b.innerHTML=`<div class="row between" style="margin-bottom:10px"><div class="small muted">A program groups events across cities (e.g. "Tech Week — Nov 2026") so targets and coverage roll up together.</div><button class="btn primary sm" id="np">+ Add program</button></div>
    <div class="card">${ps.map(p=>`<div class="reg"><div class="grow"><div class="nm">${esc(p.name)}</div><div class="small muted">${(S.ov.events||[]).filter(e=>e.program_id===p.id).length} events · created ${esc(fmtD(p.created_at))}</div></div><button class="btn sm" data-p="${p.id}">Rename</button></div>`).join("")||'<div class="empty">No programs</div>'}</div>`;
  const ed=p=>{ const n=prompt("Program name",p?p.name:"Tech Week — "); if(!n) return;
    rpc("tw_save_program",{p_token:S.token,p_data:{id:p?p.id:"",name:n,is_active:true}}).then(async r=>{ if(!r.ok) return toast(r.error,true); await loadOverview(); viewAdmin($("#view")) }).catch(e=>toast(e.message,true)) };
  $("#np").onclick=()=>ed(null); $$("[data-p]",b).forEach(x=>x.onclick=()=>ed(ps.find(p=>p.id===x.dataset.p)));
}
function adSettings(b){
  const s=S.settings||{}, st=S.ov.email_stats||{};
  b.innerHTML=`<form class="card pad stack" id="sf">
    <div><label class="f">Public link of this console</label><input class="in" id="s_url" value="${esc(s.public_url||"")}" placeholder="https://…/techweek/"><div class="tiny muted">Used for registration links, pass links and QR codes in emails.</div></div>
    <div class="grid g2"><div><label class="f">Notify on new registration (comma separated)</label><input class="in" id="s_ne" value="${esc(s.notify_email||"")}"></div>
      <div><label class="f">Reply-to email</label><input class="in" id="s_rt" value="${esc(s.reply_to||"")}"></div>
      <div><label class="f">Sender name</label><input class="in" id="s_fn" value="${esc(s.from_name||"")}"></div>
      <div><label class="f">Sender email <span class="muted" style="font-weight:400">(must be a verified domain in Resend)</span></label><input class="in" id="s_fe" value="${esc(s.from_email||"")}" placeholder="techweek@cavitak.com"></div>
      <div><label class="f">Brand name</label><input class="in" id="s_bn" value="${esc(s.brand_name||"")}"></div>
      <div><label class="f">Feedback form link (sent after attendance)</label><input class="in" id="s_fb" value="${esc(s.feedback_url||"")}" placeholder="https://forms.gle/…"></div></div>
    <div class="banner ${st.failed?"warn":"info"} small"><b>Email status (30 days):</b> ${st.sent||0} sent · ${st.failed||0} failed · ${st.queued||0} waiting.
      ${s.email_last_ok?"Last success "+esc(fmtDT(s.email_last_ok))+".":""} ${s.email_last_error?"<br>Last error: "+esc(s.email_last_error):""}</div>
    <div class="row"><button class="btn primary" id="s_go">Save settings</button></div></form>`;
  $("#sf").onsubmit=async e=>{ e.preventDefault(); const bt=$("#s_go"); busy(bt,true);
    try{ const r=await rpc("tw_settings_save",{p_token:S.token,p_data:{public_url:$("#s_url").value,notify_email:$("#s_ne").value,reply_to:$("#s_rt").value,from_name:$("#s_fn").value,from_email:$("#s_fe").value,brand_name:$("#s_bn").value,feedback_url:$("#s_fb").value}});
      busy(bt,false); if(!r.ok) return toast(r.error,true); toast("Settings saved"); await loadOverview() }catch(ex){ busy(bt,false); toast(ex.message,true) } };
}
const KIND_LABEL={received:"Request received",approved:"Confirmation + QR",waitlisted:"Waitlisted",promoted:"Seat opened",rejected:"Rejected",cancelled:"Cancelled",moved:"Session changed",reminder:"Reminder",thankyou:"Thank-you",admin_new:"Admin alert"};
async function adEmail(b){
  b.innerHTML='<div class="empty"><span class="spin dark"></span></div>';
  const r=await rpc("tw_outbox_list",{p_token:S.token,p_limit:300}).catch(e=>({rows:[]}));
  b.innerHTML=`<div class="row between" style="margin-bottom:10px"><div class="small muted">Every automatic email, newest first. Failed emails retry automatically every 10 minutes (up to 4 tries).</div><button class="btn sm" id="er">Refresh</button></div>
    <div class="card tscroll"><table class="t"><thead><tr><th>When</th><th>Email</th><th>To</th><th>Status</th><th></th></tr></thead><tbody>${r.rows.map(o=>`<tr>
      <td class="small">${esc(fmtDT(o.created_at))}</td><td><b>${esc(KIND_LABEL[o.kind]||o.kind)}</b><div class="tiny muted">${esc(o.full_name||"")}${o.organization?" · "+esc(o.organization):""}</div></td>
      <td class="small">${esc(o.to_email)}</td><td>${o.status==="sent"?'<span class="chip approved">Sent</span>':o.status==="failed"?'<span class="chip" style="background:#FDECEC;color:#9B1C22">Failed</span>':'<span class="chip pending">'+esc(o.status)+'</span>'}
      ${o.error?`<div class="tiny muted" style="max-width:260px">${esc(o.error)}</div>`:""}</td><td>${o.status!=="sent"?`<button class="btn sm" data-rt="${o.id}">Retry</button>`:""}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">No emails yet</td></tr>'}</tbody></table></div>`;
  $("#er").onclick=()=>adEmail(b);
  $$("[data-rt]",b).forEach(x=>x.onclick=async()=>{ busy(x,true); await rpc("tw_outbox_retry",{p_token:S.token,p_id:+x.dataset.rt}).catch(()=>{}); setTimeout(()=>adEmail(b),2500) });
}
async function adAudit(b){
  b.innerHTML='<div class="empty"><span class="spin dark"></span></div>';
  const r=await rpc("tw_audit_list",{p_token:S.token,p_limit:300}).catch(e=>({rows:[]}));
  b.innerHTML=`<div class="card tscroll"><table class="t"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead><tbody>${r.rows.map(a=>`<tr><td class="small">${esc(fmtDT(a.at))}</td><td class="small">${esc(a.actor||"")}</td><td><b>${esc(a.action)}</b><div class="tiny muted">${esc(a.entity||"")}</div></td>
    <td class="tiny muted" style="max-width:340px">${esc(a.detail?JSON.stringify(a.detail).slice(0,200):"")}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">No activity yet</td></tr>'}</tbody></table></div>`;
}

/* ---------------- start ---------------- */
if(params.has("e")) renderRegister();
else if(params.has("p")) renderPass();
else if(params.has("c")) renderSelfCheckin();
else if(params.has("d")) renderDisplay();
else bootConsole();
</script>
